name: Publish Skiko WinUI

on:
  push:
    branches:
      - winui_dev
    tags:
      - 'skiko-winui/v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
      - '**/*.log'
      - '**/*.iml'
      - '.idea/**'
      - '.run/**'
      - 'docs/**'
      - 'samples/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build a development snapshot or the pinned release'
        type: choice
        options: [snapshot, release]
        default: snapshot
      publish:
        description: 'Upload artifacts (a release must run from its matching tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skiko-winui-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-skiko-winui:
    name: Publish skiko-winui to Maven
    runs-on: windows-2022
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published: ${{ steps.upload.outcome }}

    steps:
      - name: Checkout Skiko
        uses: actions/checkout@v4
        with:
          path: compose-fluent-skiko
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve pinned release configuration
        id: release
        working-directory: compose-fluent-skiko
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          $channel = 'snapshot'
          if ($env:GITHUB_REF.StartsWith('refs/tags/skiko-winui/v')) {
            $channel = 'release'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $channel = $env:REQUESTED_CHANNEL
          }
          $publish = $env:GITHUB_EVENT_NAME -eq 'push' -or $env:REQUESTED_PUBLISH -eq 'true'
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          python scripts/skiko_winui_release.py metadata --channel $channel --github-output $env:GITHUB_OUTPUT

      - name: Test release tooling
        working-directory: compose-fluent-skiko
        shell: pwsh
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Verify upstream source and release tag
        if: steps.release.outputs.channel == 'release'
        working-directory: compose-fluent-skiko
        shell: pwsh
        run: |
          $arguments = @('scripts/skiko_winui_release.py', 'verify', '--fetch-upstream')
          if ('${{ steps.release.outputs.publish }}' -eq 'true') {
            $arguments += '--for-publish'
          }
          python @arguments

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Windows SDK 10.0.26100.0
        shell: pwsh
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\References\10.0.26100.0"
          if (Test-Path $sdkPath) {
            Write-Host "Windows SDK 10.0.26100.0 already installed at $sdkPath"
          } else {
            winget install --id Microsoft.WindowsSDK.10.0.26100 `
              --silent `
              --accept-source-agreements `
              --accept-package-agreements
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget exited with code $LASTEXITCODE (may indicate already installed)"
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }
          "SKIKO_VSBT_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Configure NuGet cache path
        shell: pwsh
        run: |
          "NUGET_PACKAGES=${{ runner.temp }}\nuget-packages" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\nuget-packages
            ~\.gradle\caches\kotlin-winrt\nuget
          key: nuget-${{ runner.os }}-Microsoft.WindowsAppSDK-2.1.3
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Download Skia Windows dependency
        working-directory: compose-fluent-skiko/skiko
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gradle -p . unzipSkiaReleaseWindowsX64 --no-daemon --stacktrace --no-configuration-cache --max-workers=1 \
              -Pskiko.winui.enabled=true \
              -Pskiko.winui.jvmTarget=25 \
              -Pskiko.winui.jvmToolchain=25 \
              -Pskiko.winui.mingw.enabled=true \
              -Pskiko.winui.skipSamples=true && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Build and verify skiko-winui publications
        working-directory: compose-fluent-skiko
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ steps.release.outputs.publish == 'true' && secrets.MAVEN_GPG_KEY_ID || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ steps.release.outputs.publish == 'true' && secrets.MAVEN_GPG_KEY_ARMOR || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ steps.release.outputs.publish == 'true' && secrets.MAVEN_GPG_KEY_PASSWORD || '' }}
        run: |
          for attempt in 1 2 3; do
            gradle -p . --no-daemon --stacktrace --no-configuration-cache --refresh-dependencies --max-workers=1 \
              -Dorg.gradle.parallel=false \
              -Pskiko.winui.enabled=true \
              -Pskiko.winui.jvmTarget=25 \
              -Pskiko.winui.jvmToolchain=25 \
              -Pskiko.winui.mingw.enabled=true \
              -Pskiko.winui.skipSamples=true \
              -Pdeploy.release=${{ steps.release.outputs.channel == 'release' }} \
              -Pskiko.version=${{ steps.release.outputs.version }} \
              :skiko:checkWinuiAwtFreeBoundary \
              :skiko:checkWinuiJvmApiClasspathBoundary \
              :skiko:publishSkikoWinuiToBuildRepo && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Publish skiko-winui snapshot
        if: steps.release.outputs.channel == 'snapshot' && steps.release.outputs.publish == 'true'
        working-directory: compose-fluent-skiko
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY_ARMOR }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            gradle -p . --no-daemon --stacktrace --no-configuration-cache --refresh-dependencies --max-workers=1 \
              -Dorg.gradle.parallel=false \
              -Pskiko.winui.enabled=true \
              -Pskiko.winui.jvmTarget=25 \
              -Pskiko.winui.jvmToolchain=25 \
              -Pskiko.winui.mingw.enabled=true \
              -Pskiko.winui.skipSamples=true \
              -Pskiko.version=${{ steps.release.outputs.version }} \
              :skiko:publishSkikoWinuiToMavenCentral && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Assemble Central Portal release bundle
        if: steps.release.outputs.channel == 'release'
        working-directory: compose-fluent-skiko
        shell: pwsh
        run: |
          $arguments = @('scripts/skiko_winui_release.py', 'bundle', '--output', 'skiko/build/release/${{ steps.release.outputs.version }}')
          if ('${{ steps.release.outputs.publish }}' -ne 'true') {
            $arguments += '--dry-run'
          }
          python @arguments

      - name: Publish pinned release to Central Portal
        id: upload
        if: steps.release.outputs.channel == 'release' && steps.release.outputs.publish == 'true'
        working-directory: compose-fluent-skiko
        shell: pwsh
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python scripts/skiko_winui_release.py upload

      - name: Save release bundle and provenance
        if: always() && steps.release.outputs.channel == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: skiko-winui-${{ steps.release.outputs.version }}-release
          path: compose-fluent-skiko/skiko/build/release/${{ steps.release.outputs.version }}/
          if-no-files-found: warn

  github-release:
    name: Create GitHub release after Maven publication
    needs: publish-skiko-winui
    if: needs.publish-skiko-winui.outputs.published == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skiko-winui-${{ needs.publish-skiko-winui.outputs.version }}-release
          path: release
      - name: Create release with the fixed upstream mapping
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish-skiko-winui.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.publish-skiko-winui.outputs.version }}
          PRERELEASE: ${{ needs.publish-skiko-winui.outputs.prerelease }}
        run: |
          arguments=(--verify-tag --title "skiko-winui $RELEASE_VERSION" --notes-file release/release-notes.md)
          if [ "$PRERELEASE" = 'true' ]; then
            arguments+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "release/skiko-winui-$RELEASE_VERSION-central.zip" \
            release/release-manifest.json "${arguments[@]}"
